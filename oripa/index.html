<title>オリパの遊園地 ライブカウンター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0d1638; --navy2:#16214d; --card:#141f4a; --line:rgba(255,255,255,.10);
    --red:#ef4f3f; --orange:#f59a2f; --yellow:#f8cb46; --blue:#41aef5; --green:#5fd07a; --pink:#ff7aa8;
    --text:#fdf6e3; --muted:#a9b3d6;
    --gap:clamp(6px,1.3vmin,14px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--navy);color:var(--text);
    font-family:"M PLUS Rounded 1c",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #23307a 0%, transparent 60%),
      radial-gradient(800px 500px at 110% 110%, #3a1d5c 0%, transparent 60%),
      var(--navy);
  }
  #stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:50}

  .app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;gap:var(--gap);
    padding:max(env(safe-area-inset-top),clamp(8px,1.5vmin,18px)) max(env(safe-area-inset-right),clamp(8px,1.8vmin,20px))
            max(env(safe-area-inset-bottom),clamp(8px,1.5vmin,18px)) max(env(safe-area-inset-left),clamp(8px,1.8vmin,20px));}

  /* header */
  header{display:flex;align-items:center;gap:clamp(8px,1.4vmin,14px);flex:0 0 auto}
  .logo{width:clamp(32px,7vmin,60px);height:clamp(32px,7vmin,60px);border-radius:50%;
    box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 18px rgba(248,203,70,.35);flex:0 0 auto}
  .title{font-weight:900;font-size:clamp(15px,3.2vmin,30px);letter-spacing:.04em;line-height:1.1;
    background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow),var(--green),var(--blue));
    -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-family:Fredoka,sans-serif;font-weight:600;font-size:clamp(9px,1.5vmin,13px);color:var(--muted);letter-spacing:.18em}
  .spacer{flex:1}
  .clock{text-align:right;line-height:1}
  .clock .t{font-family:Fredoka,sans-serif;font-weight:600;font-size:clamp(20px,4.6vmin,42px);font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .clock .d{font-family:Fredoka,sans-serif;font-size:clamp(9px,1.5vmin,13px);color:var(--muted);margin-top:3px}
  .iconbtn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);
    width:clamp(34px,6.2vmin,50px);height:clamp(34px,6.2vmin,50px);border-radius:14px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
  .iconbtn svg{width:55%;height:55%}
  .iconbtn:active{transform:scale(.94)}

  /* main layout */
  .main{flex:1 1 auto;min-height:0;display:grid;gap:var(--gap);grid-template-columns:.9fr 1.2fr}
  .stats{min-height:0;display:grid;gap:var(--gap);grid-template-columns:1fr 1fr;grid-template-rows:1.15fr 1fr;
    grid-template-areas:"rate rate" "rem win"}
  .card{position:relative;border-radius:clamp(14px,2.4vmin,24px);background:linear-gradient(180deg,var(--navy2),var(--card));
    border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:0;min-width:0;overflow:hidden;padding:clamp(6px,1.2vmin,12px)}
  .card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;pointer-events:none;
    background:var(--ring);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;opacity:.9}
  .rem{grid-area:rem;--ring:linear-gradient(135deg,var(--blue),transparent 60%)}
  .win{grid-area:win;--ring:linear-gradient(135deg,var(--red),var(--orange) 40%,transparent 75%)}
  .rate{grid-area:rate;--ring:linear-gradient(135deg,var(--yellow),var(--green) 45%,transparent 80%)}
  .board{--ring:linear-gradient(135deg,var(--pink),var(--blue) 50%,transparent 85%);justify-content:flex-start;align-items:stretch}
  .label{font-weight:800;font-size:clamp(11px,2.3vmin,20px);letter-spacing:.08em;display:flex;align-items:center;gap:.4em}
  .label .dot{width:.6em;height:.6em;border-radius:50%;background:currentColor}
  .rem .label{color:var(--blue)} .win .label{color:var(--orange)} .rate .label{color:var(--yellow)} .board .label{color:var(--pink)}
  .num{font-family:Fredoka,sans-serif;font-weight:700;line-height:.95;font-variant-numeric:tabular-nums;
    font-size:min(8.5vw,17vh);letter-spacing:-.01em;margin:.06em 0;transition:transform .15s}
  .rem .num{color:#fff}
  .win .num{color:var(--yellow);text-shadow:0 0 .25em rgba(248,203,70,.35)}
  .rate .num{font-size:min(8.5vw,19vh);color:var(--green);text-shadow:0 0 .3em rgba(95,208,122,.4)}
  .rate .num small{font-size:.45em;margin-left:.04em}
  .bump{animation:bump .35s ease}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
  .up{animation:up .9s ease} .down{animation:down .9s ease}
  @keyframes up{0%,100%{filter:none}30%{filter:brightness(1.5) drop-shadow(0 0 12px var(--green))}}
  @keyframes down{0%,100%{filter:none}30%{filter:saturate(.4) brightness(.8)}}
  .meta{font-size:clamp(10px,1.8vmin,15px);color:var(--muted);font-weight:700}
  .meta b{font-family:Fredoka,sans-serif;color:var(--text);font-size:1.15em}
  .bar{width:78%;height:clamp(4px,.9vmin,8px);border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:clamp(3px,.8vmin,8px) 0}
  .bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--yellow),var(--green));transition:width .4s}
  .streak{position:absolute;top:clamp(6px,1.1vmin,12px);right:clamp(8px,1.4vmin,14px);font-size:clamp(10px,1.7vmin,14px);color:var(--muted);font-weight:800}
  .streak b{font-family:Fredoka,sans-serif;color:var(--pink);font-size:1.4em;margin:0 .1em}

  /* board */
  .bhead{display:flex;align-items:center;gap:8px;padding:2px 4px clamp(6px,1.1vmin,10px)}
  .bhead .cnt{font-size:clamp(12px,2.2vmin,18px);color:var(--muted);font-weight:800}
  .bhead .cnt b{font-family:Fredoka,sans-serif;color:var(--text);font-size:1.2em}
  .bhead .cnt .o{color:var(--red)}
  .smallbtn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);font-family:inherit;font-weight:800;
    font-size:clamp(10px,1.7vmin,14px);padding:.45em .9em;border-radius:99px;cursor:pointer}
  .smallbtn:active{transform:scale(.95)}
  .grid{flex:1;min-height:0;display:grid;gap:clamp(5px,1vmin,10px);grid-template-columns:repeat(var(--cols,5),1fr);grid-auto-rows:1fr}
  .cell{position:relative;appearance:none;border:0;border-radius:clamp(8px,1.4vmin,14px);container-type:size;
    background:linear-gradient(180deg,#fffaf0,#f1e3c2);color:#16214d;font-family:Fredoka,sans-serif;font-weight:700;
    cursor:pointer;display:block;min-height:0;min-width:0;padding:0;overflow:hidden;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.25);transition:transform .08s}
  .cell:active{transform:scale(.96)}
  .cell span{position:absolute;inset:0;display:grid;place-items:center;font-size:min(64cqh,52cqw);line-height:1;z-index:1;font-variant-numeric:tabular-nums}
  .cell::after{content:"";position:absolute;pointer-events:none;z-index:2}
  /* 当たり：金色＋赤い○ */
  .cell.hit{background:linear-gradient(180deg,#ffe27a,#f6b73c);color:#4a1d00;box-shadow:0 0 0 2px #fff6cf,0 0 16px rgba(248,203,70,.6)}
  .cell.hit::after{width:min(88cqh,80cqw);aspect-ratio:1;border-radius:50%;border:max(4px,9cqh) solid var(--red);
    left:50%;top:50%;transform:translate(-50%,-50%);animation:pop .35s ease}
  /* ハズレ：暗く＋斜線 */
  .cell.miss{background:#0f1636;color:rgba(255,255,255,.28);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  .cell.miss::after{inset:0;background:linear-gradient(to top right,transparent calc(50% - 3px),#c9d1f2 calc(50% - 3px),#c9d1f2 calc(50% + 3px),transparent calc(50% + 3px))}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

  /* controls */
  .controls{flex:0 0 auto;display:grid;grid-template-columns:1.3fr 1fr auto auto;gap:var(--gap);height:clamp(46px,11vmin,92px)}
  .btn{appearance:none;border:0;border-radius:clamp(12px,2vmin,20px);font-family:inherit;font-weight:900;cursor:pointer;
    font-size:clamp(16px,3.8vmin,34px);letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:.35em;
    transition:transform .08s, filter .15s}
  .btn:active{transform:translateY(2px) scale(.98)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .hit{color:#3a1500;background:linear-gradient(180deg,#ffe07a,var(--yellow) 45%,var(--orange));box-shadow:0 5px 0 #b8651b,0 10px 24px rgba(245,154,47,.35)}
  .hit:active{box-shadow:0 2px 0 #b8651b}
  .miss{color:var(--text);background:linear-gradient(180deg,#2a3670,#1c2657);box-shadow:0 5px 0 #0a1030;border:1px solid var(--line)}
  .miss:active{box-shadow:0 2px 0 #0a1030}
  .sq{width:clamp(56px,11vmin,92px);white-space:nowrap;padding:0 4px;background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line);font-size:clamp(9px,1.6vmin,14px);flex-direction:column;gap:2px;letter-spacing:0}
  .sq svg{width:40%;height:auto}
  .reset{color:#ffb3aa;border-color:rgba(239,79,63,.45);background:rgba(239,79,63,.10)}
  .kbd{font-family:Fredoka,sans-serif;font-size:.42em;opacity:.55;font-weight:600}

  /* stream mode */
  body.stream .controls{display:none}
  body.stream #fsBtn, body.stream #setBtn, body.stream #boardReset{opacity:.12}
  body.stream #fsBtn:hover, body.stream #setBtn:hover, body.stream #boardReset:hover{opacity:1}
  body.noboard .board{display:none}
  body.noboard .main{grid-template-columns:1fr}
  body.noboard .stats{grid-template-columns:1fr 1fr 1.25fr;grid-template-rows:1fr;grid-template-areas:"rem win rate"}
  body.noboard .num{font-size:min(14vw,28vh)} body.noboard .rate .num{font-size:min(11.5vw,26vh)}

  /* portrait */
  @media (max-aspect-ratio: 1/1){
    .main{grid-template-columns:1fr;grid-template-rows:.85fr 1.15fr}
    .num{font-size:min(15vw,8vh)} .rate .num{font-size:min(17vw,9vh)}
    body.noboard .main{grid-template-rows:1fr}
    body.noboard .stats{grid-template-columns:1fr 1fr;grid-template-rows:1.1fr 1fr;grid-template-areas:"rate rate" "rem win"}
    body.noboard .num{font-size:min(19vw,15vh)} body.noboard .rate .num{font-size:min(22vw,15vh)}
    .controls{height:clamp(56px,9vh,100px)}
  }

  /* hit splash */
  #splash{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:60}
  #splash span{font-weight:900;font-size:min(22vw,34vh);letter-spacing:.04em;opacity:0;
    background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow),var(--green),var(--blue));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 0 rgba(0,0,0,.35)) drop-shadow(0 0 30px rgba(248,203,70,.5))}
  #splash.on span{animation:splash 1.3s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes splash{0%{opacity:0;transform:scale(.3) rotate(-8deg)}25%{opacity:1;transform:scale(1.08) rotate(2deg)}
    70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}


  /* lamp (ペカる演出) */
  #lamp{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(0,0,0,0);transition:background .2s;cursor:pointer}
  #lamp.show{display:grid;background:rgba(2,4,14,.9)}
  .lampbox{position:relative;width:min(78vw,74vh);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 50% 45%,#2a2140 0%,#120d22 62%,#07050f 100%);
    box-shadow:inset 0 0 0 clamp(6px,1.4vmin,14px) #2b2440,inset 0 0 40px rgba(0,0,0,.8),0 0 0 3px #3a3256;
    display:grid;place-items:center;transform:scale(.92);transition:transform .15s}
  .bulb{position:absolute;width:5.2%;aspect-ratio:1;border-radius:50%;background:#4a3f2a;transform:translate(-50%,-50%);
    box-shadow:inset 0 -2px 3px rgba(0,0,0,.5)}
  .lcore{text-align:center;line-height:1;position:relative}
  .ltxt{font-weight:900;font-size:min(17vw,16vh);letter-spacing:.02em;color:#3a3150;transition:none}
  .lsub{font-family:Fredoka,sans-serif;font-weight:700;font-size:min(5vw,4.6vh);letter-spacing:.3em;color:#3a3150;margin-top:.5em}
  .lhint{position:absolute;bottom:4vh;left:0;right:0;text-align:center;color:rgba(255,255,255,.35);font-size:12px;font-weight:800}
  /* ON */
  #lamp.lit .lampbox{transform:scale(1);
    background:radial-gradient(circle at 50% 45%,#ffd2f0 0%,#ff4fa8 22%,#8a1fd0 52%,#2a0a55 78%,#12052a 100%);
    box-shadow:inset 0 0 0 clamp(6px,1.4vmin,14px) #ffcf4d,inset 0 0 60px rgba(255,255,255,.35),0 0 60px 10px rgba(255,80,180,.55),0 0 160px 40px rgba(140,60,255,.35)}
  #lamp.lit .ltxt{color:#fff;text-shadow:0 0 .08em #fff,0 0 .2em #ffe14d,0 0 .45em #ff7a1a,0 .06em 0 #b3005e}
  #lamp.lit .lsub{color:#fff3b0;text-shadow:0 0 10px #ffcf4d}
  #lamp.lit .bulb{background:#fff6c2;box-shadow:0 0 6px 2px #ffe066,0 0 16px 6px rgba(255,190,40,.7)}
  #lamp.lit .bulb:nth-child(2n){animation:chase .28s steps(1) infinite}
  #lamp.lit .bulb:nth-child(2n+1){animation:chase .28s steps(1) infinite .14s}
  @keyframes chase{0%{opacity:1}50%{opacity:.25}}
  #lamp.blink .lampbox{animation:blink 1.6s steps(1) 1}
  @keyframes blink{0%{filter:none}30%{filter:brightness(.25) saturate(.3)}38%{filter:none}62%{filter:brightness(.25) saturate(.3)}70%{filter:none}}
  #lamp.lit.flash::after{content:"";position:fixed;inset:0;background:#fff;animation:flash .35s ease-out forwards;pointer-events:none}
  @keyframes flash{0%{opacity:.85}100%{opacity:0}}

  /* toast */
  #toast{position:fixed;left:50%;bottom:calc(clamp(46px,11vmin,92px) + 28px);transform:translate(-50%,20px);z-index:90;
    background:#1f2a63;border:1px solid var(--line);color:var(--text);font-weight:800;font-size:14px;padding:10px 16px;border-radius:99px;
    opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  /* sheets */
  .sheet{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(5,8,25,.7);backdrop-filter:blur(6px)}
  .sheet.open{display:flex}
  .panel{width:min(560px,94vw);max-height:92vh;overflow:auto;background:#121b44;border:1px solid var(--line);border-radius:22px;padding:20px 20px 16px;user-select:text}
  .panel h2{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:10px}
  .panel h2 img{width:34px;height:34px;border-radius:50%}
  .row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .row label{font-weight:800;font-size:15px}
  .row small{display:block;color:var(--muted);font-weight:700;font-size:11px;margin-top:2px}
  .step{display:flex;align-items:center;gap:6px}
  .step button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#1d2860;color:var(--text);font-size:20px;font-weight:800;cursor:pointer}
  .step input{width:96px;height:40px;border-radius:12px;border:1px solid var(--line);background:#0b1230;color:var(--text);
    font-family:Fredoka,sans-serif;font-size:20px;font-weight:600;text-align:center}
  .txt{width:200px;height:40px;border-radius:12px;border:1px solid var(--line);background:#0b1230;color:var(--text);font-family:inherit;font-size:15px;font-weight:700;padding:0 10px}
  .switch{position:relative;width:54px;height:30px;border-radius:99px;background:#2a3466;border:0;cursor:pointer}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .18s}
  .switch.on{background:var(--green)} .switch.on::after{left:27px}
  .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .actions button{flex:1;min-width:110px;height:48px;border-radius:14px;border:0;font-family:inherit;font-weight:900;font-size:16px;cursor:pointer;color:var(--text)}
  .apply{background:linear-gradient(180deg,#ffe07a,var(--orange));color:#3a1500!important}
  .close{background:#24306a}
  .hint{color:var(--muted);font-size:12px;font-weight:700;margin-top:12px;line-height:1.6}
  .err{color:#ff8f84;font-size:12px;font-weight:800;min-height:1em;margin-top:6px}


  /* pick dialog */
  .pick{width:min(380px,92vw);text-align:center}
  .pick .no{font-family:Fredoka,sans-serif;font-weight:700;font-size:64px;line-height:1;margin:4px 0 16px}
  .pick .no small{font-size:.3em;color:var(--muted);margin-right:.2em;font-family:"M PLUS Rounded 1c"}
  .pick .actions{margin-top:0}
  .pick .pHit{background:linear-gradient(180deg,#ffe07a,var(--orange));color:#3a1500!important;font-size:20px;height:60px}
  .pick .pMiss{background:#2a3670;font-size:20px;height:60px}
  .pick .pClear{background:transparent;border:1px solid var(--line)!important;color:var(--muted)}
  .mk{display:inline-grid;place-items:center;width:1.3em;height:1.3em;margin-right:.2em}

  /* neon (パチスロ風ネオン) */
  #neon{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(0,0,0,.94);cursor:pointer}
  #neon.show{display:grid}
  .nbox{position:relative;background:#05060f;padding:min(5vh,5vw) min(6vw,9vh);border-radius:min(5vw,5vh);border:min(1.2vw,1.2vh) solid #1a1d33;
    transform:skewX(-8deg);text-align:center;line-height:1}
  .ntxt{font-weight:900;font-size:min(15vw,22vh);letter-spacing:.02em;color:#2a1426;white-space:nowrap}
  .nsub{font-family:Fredoka,sans-serif;font-weight:700;font-size:min(6vw,6.5vh);letter-spacing:.35em;color:#141a33;margin-top:.35em;padding-left:.35em}
  #neon.lit .nbox{border-color:#7fb0ff;box-shadow:0 0 6px #fff,0 0 18px #3d7bff,0 0 50px #2457ff,0 0 110px rgba(36,87,255,.7),inset 0 0 18px #3d7bff,inset 0 0 50px rgba(36,87,255,.5)}
  #neon.lit .ntxt{color:#fff0f8;text-shadow:0 0 4px #fff,0 0 12px #ff4fa3,0 0 28px #ff1f8a,0 0 60px #ff1f8a,0 0 110px rgba(255,31,138,.8)}
  #neon.lit .nsub{color:#e6f0ff;text-shadow:0 0 6px #fff,0 0 16px #3d7bff,0 0 40px #2457ff}
  #neon.lit .nbox{animation:ignite .6s linear 1}
  @keyframes ignite{0%{opacity:1}8%{opacity:.15}14%{opacity:1}22%{opacity:.3}30%{opacity:1}44%{opacity:.6}52%{opacity:1}100%{opacity:1}}
  #neon.blink .nbox{animation:nblink 1.8s steps(1) 1}
  @keyframes nblink{0%{opacity:1}25%{opacity:.08}35%{opacity:1}55%{opacity:.08}65%{opacity:1}}
  #neon.flash::after{content:"";position:fixed;inset:0;background:radial-gradient(circle,#ffd0ea,#ff4fa3 40%,#2457ff);animation:flash .4s ease-out forwards;pointer-events:none;mix-blend-mode:screen}
  .nhint{position:absolute;bottom:4vh;left:0;right:0;text-align:center;color:rgba(255,255,255,.3);font-size:12px;font-weight:800}
</style>
</head>

<canvas id="fx"></canvas>

<div id="neon" aria-hidden="true"><div class="nbox"><div class="ntxt">当たり！</div><div class="nsub">BIG WIN</div></div><div class="nhint">タップで閉じる</div></div>
<div id="lamp" aria-hidden="true"><div class="lampbox" id="lampbox"><div class="lcore"><div class="ltxt">当たり！</div><div class="lsub">CONGRATULATIONS</div></div></div><div class="lhint">タップで閉じる</div></div>

    <div class="row">
      <label>残り口数<small>今残っている口数の合計</small></label>
      <div class="step"><button data-t="sRem" data-d="-1">−</button><input id="sRem" type="number" inputmode="numeric" min="0"><button data-t="sRem" data-d="1">＋</button></div>
    </div>
    <div class="row">
      <label>当たり残口数<small>残っている当たりの数</small></label>
      <div class="step"><button data-t="sWin" data-d="-1">−</button><input id="sWin" type="number" inputmode="numeric" min="0"><button data-t="sWin" data-d="1">＋</button></div>
    </div>
    <div class="row">
      <label>連続ハズレ<small>手動で直したいとき</small></label>
      <div class="step"><button data-t="sStr" data-d="-1">−</button><input id="sStr" type="number" inputmode="numeric" min="0"><button data-t="sStr" data-d="1">＋</button></div>
    </div>
    <div class="row">
      <label>番号表のマス数<small>1〜○番まで（最大60）</small></label>
      <div class="step"><button data-t="sSize" data-d="-1">−</button><input id="sSize" type="number" inputmode="numeric" min="1" max="60"><button data-t="sSize" data-d="1">＋</button></div>
    </div>
    <div class="err" id="err"></div>
    <div class="row">
      <label>番号表を表示</label>
      <button class="switch" id="swBoard" aria-label="番号表を表示"></button>
    </div>
    <div class="row">
      <label>タイトル<small>画面上部に出る名前</small></label>
      <input class="txt" id="sTitle" maxlength="24">
    </div>
    <div class="row">
      <label>当たり演出<small>オフにすると演出なし</small></label>
      <button class="switch" id="swFx" aria-label="当たり演出"></button>
    </div>
    <div class="row">
      <label>演出の種類<small>ネオン・ランプ＝ガコッ！と光る ／ 紙吹雪＝ファンファーレ</small></label>
      <div class="step"><select id="sFxType" class="txt" style="width:150px"><option value="neon">ネオン（パチスロ風）</option><option value="lamp">ランプ（遊園地）</option><option value="confetti">紙吹雪</option></select></div>
    </div>
    <div class="row">
      <label>当たり音<small>演出に合わせて音を鳴らす</small></label>
      <button class="switch" id="swSound" aria-label="当たり音"></button>
    </div>
    <div class="row">
      <label>配信モード<small>下のボタンを隠す（番号表のタップとキーボードA/H/Zは使えます）</small></label>
      <button class="switch" id="swStream" aria-label="配信モード"></button>
    </div>
    <div class="actions">
      <button class="apply" id="applyBtn">反映する</button>
      <button class="close" id="closeBtn">閉じる</button>
    </div>
    <div class="hint">・「反映する」を押した時の残り口数と当たり残口数が、<b>リセットボタンで戻る数字</b>になります。<br>
      ・番号をタップ →「○当たり」か「／ハズレ」を選ぶと、表に印がついて口数も減ります。<br>
      ・リセットや押し間違いは「戻す」で取り消せます。数字はこの端末のブラウザに保存されます。</div>
  </div>
</div>

<script>
(function(){
  const KEY='oripa-yuenchi-counter-v2';
  let s={rem:200,win:50,streak:0,start:{rem:200,win:50},size:20,board:[],showBoard:true,title:'オリパの遊園地',fx:true,fxType:'neon',sound:true,stream:false};
  let hist=[];
  try{
    const v=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(localStorage.getItem('oripa-yuenchi-counter-v1')||'null');
    if(v) s=Object.assign(s,v);
    if(!v||!v.start) s.start={rem:s.rem,win:s.win};
  }catch(e){}
  const fixBoard=()=>{ s.board=Array.from({length:s.size},(_,i)=>s.board[i]||null); };
  fixBoard();
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};
  const $=id=>document.getElementById(id);

  /* board grid */
  function buildGrid(){
    const g=$('grid'); g.innerHTML='';
    const port=matchMedia('(max-aspect-ratio: 1/1)').matches;
    const cols=s.size<=5?s.size:(s.size<=25?5:(s.size<=36?6:(s.size<=49?7:8)));
    const rows=Math.ceil(s.size/cols);
    g.style.setProperty('--cols',cols);
    g.style.gridTemplateRows='repeat('+rows+',1fr)';
    const k=Math.max(cols,rows*1.2);
    for(let i=0;i<s.size;i++){
      const b=document.createElement('button'); b.className='cell'; b.innerHTML='<span>'+(i+1)+'</span>'; b.dataset.i=i;
      b.onclick=()=>openPick(i); g.appendChild(b);
    }
  }
  function paintGrid(){
    const cells=$('grid').children; let left=0,hits=0;
    for(let i=0;i<cells.length;i++){
      const st=s.board[i]; cells[i].className='cell'+(st?' '+st:'');
      if(!st) left++; if(st==='hit') hits++;
    }
    $('bLeft').textContent=left; $('bHit').textContent=hits;
  }

  let lastRate=null;
  function render(){
    $('remN').textContent=s.rem;
    $('winN').textContent=s.win;
    $('strN').textContent=s.streak;
    $('titleText').textContent=s.title||'オリパの遊園地';
    const rateEl=$('rateN');
    if(s.rem>0){
      const r=s.win/s.rem*100;
      rateEl.innerHTML=(r>=99.95?'100':r.toFixed(1))+'<small>%</small>';
      $('barI').style.width=Math.min(100,r)+'%';
      $('oneIn').innerHTML=s.win>0?'約 <b>'+(s.rem/s.win).toFixed(1)+'</b> 口に1口':'当たりは残っていません';
      if(lastRate!==null && Math.abs(r-lastRate)>1e-9){
        rateEl.classList.remove('up','down'); void rateEl.offsetWidth;
        rateEl.classList.add(r>lastRate?'up':'down');
      }
      lastRate=r;
    }else{
      rateEl.innerHTML='—'; $('barI').style.width='0'; $('oneIn').textContent='完売'; lastRate=null;
    }
    $('hitBtn').disabled=!canHit();
    $('missBtn').disabled=!canMiss();
    $('undoBtn').disabled=hist.length===0;
    document.body.classList.toggle('stream',!!s.stream);
    document.body.classList.toggle('noboard',!s.showBoard);
    paintGrid();
    save();
  }
  const canHit=()=>s.rem>0&&s.win>0;
  const canMiss=()=>s.rem>s.win;
  function bump(id){const el=$(id);el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
  function push(){hist.push(JSON.stringify({rem:s.rem,win:s.win,streak:s.streak,board:s.board,size:s.size})); if(hist.length>300) hist.shift();}

  let toastT;
  function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}

  function hit(idx){
    if(!canHit()){toast('当たりが残っていません');return false}
    push(); s.rem--; s.win--; s.streak=0;
    if(idx!=null) s.board[idx]='hit';
    render(); bump('remN'); bump('winN');
    const snd=s.sound!==false;
    const ft=s.fxType||'neon';
    if(ft==='neon'||ft==='lamp'){ if(s.fx) lampOn(ft); if(snd){ gako(s.fx?0.28:0); if(ft==='neon') buzz(s.fx?0.3:0.02); } }
    else { if(s.fx) celebrate(); if(snd) fanfare(); }
    return true;
  }
  function miss(idx){
    if(!canMiss()){toast('残りは全部当たりです');return false}
    push(); s.rem--; s.streak++;
    if(idx!=null) s.board[idx]='miss';
    render(); bump('remN');
    return true;
  }
  function clearCell(idx){
    const st=s.board[idx]; if(!st) return;
    push(); s.board[idx]=null; s.rem++;
    if(st==='hit') s.win++; else s.streak=Math.max(0,s.streak-1);
    render();
  }
  function undo(){
    const h=hist.pop(); if(!h) return;
    const o=JSON.parse(h);
    const sizeChanged=o.size!==s.size;
    Object.assign(s,o); if(sizeChanged) buildGrid();
    lastRate=null; render();
  }
  function fullReset(){
    push();
    s.rem=s.start.rem; s.win=s.start.win; s.streak=0; s.board=Array(s.size).fill(null);
    lastRate=null; render(); bump('remN'); bump('winN');
    toast('リセットしました（「戻す」で元に戻せます）');
  }
  function boardReset(){
    if(s.board.every(x=>!x)) return;
    push(); s.board=Array(s.size).fill(null); render();
    toast('番号表をリセットしました');
  }
  $('hitBtn').onclick=()=>hit(); $('missBtn').onclick=()=>miss(); $('undoBtn').onclick=undo;
  $('resetBtn').onclick=fullReset; $('boardReset').onclick=boardReset;


  /* fanfare (Web Audio, no files) */
  let ac=null;
  function fanfare(){
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended') ac.resume();
      const t0=ac.currentTime+0.02, out=ac.createGain(); out.gain.value=0.5; out.connect(ac.destination);
      const f=n=>440*Math.pow(2,(n-69)/12);
      function note(m,st,dur,type,vol,vib){
        const o=ac.createOscillator(), g=ac.createGain();
        o.type=type; o.frequency.value=f(m);
        if(vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=6;lg.gain.value=f(m)*0.012;l.connect(lg);lg.connect(o.frequency);l.start(t0+st);l.stop(t0+st+dur+.1)}
        g.gain.setValueAtTime(0,t0+st); g.gain.linearRampToValueAtTime(vol,t0+st+0.015);
        g.gain.setValueAtTime(vol,t0+st+dur*0.7); g.gain.exponentialRampToValueAtTime(0.0001,t0+st+dur);
        o.connect(g); g.connect(out); o.start(t0+st); o.stop(t0+st+dur+0.05);
      }
      // パパパパーン！
      const seq=[[72,0],[72,.11],[72,.22],[76,.33]];
      seq.forEach(([m,st])=>{note(m,st,.1,'square',.16);note(m-12,st,.1,'triangle',.18)});
      // 最後の和音（C major）
      [[72,.48],[76,.48],[79,.48],[84,.48]].forEach(([m,st])=>{note(m,st,1.1,'square',.09,true);});
      note(48,.48,1.1,'triangle',.25); note(60,.48,1.1,'sawtooth',.05,true);
      // キラキラ
      [96,100,103,108,103,108,112].forEach((m,i)=>note(m,.55+i*.07,.25,'sine',.07));
    }catch(e){}
  }


  /* lamp effect */
  (function(){
    const box=$('lampbox'), N=28;
    for(let i=0;i<N;i++){const b=document.createElement('i');b.className='bulb';const a=i/N*Math.PI*2;
      b.style.left=(50+45.5*Math.cos(a))+'%'; b.style.top=(50+45.5*Math.sin(a))+'%'; box.insertBefore(b,box.firstChild);}
  })();
  let lampT=[];
  function lampOff(){lampT.forEach(clearTimeout);lampT=[];$('lamp').className='';$('neon').className=''}
  function lampOn(kind){
    lampOff(); const L=$(kind==='neon'?'neon':'lamp');
    L.className='show';                       // 暗転
    lampT.push(setTimeout(()=>{L.className='show lit flash'},280));       // ガコッ！で点灯
    lampT.push(setTimeout(()=>{L.className='show lit blink'},1600));      // 点滅
    lampT.push(setTimeout(lampOff,4400));
  }
  $('lamp').onclick=lampOff; $('neon').onclick=lampOff;

  /* ネオンが点く「ジジッ」音 */
  function buzz(delay){
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      const t0=ac.currentTime+delay, o=ac.createOscillator(), lp=ac.createBiquadFilter(), g=ac.createGain();
      o.type='sawtooth'; o.frequency.value=100; lp.type='lowpass'; lp.frequency.value=900;
      const steps=[[0,.25],[.05,0],[.08,.3],[.14,0],[.17,.22],[.22,.12],[.5,.0001]];
      g.gain.setValueAtTime(0.0001,t0); steps.forEach(([d,v])=>g.gain.setValueAtTime(Math.max(v,0.0001),t0+d));
      o.connect(lp); lp.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+.55);
    }catch(e){}
  }

  /* ガコッ！ (synthesized clunk) */
  function gako(delay){
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended') ac.resume();
      const t0=ac.currentTime+0.02+delay, out=ac.createGain(); out.gain.value=0.9; out.connect(ac.destination);
      // 低い衝撃音
      const o=ac.createOscillator(), g=ac.createGain(); o.type='sine';
      o.frequency.setValueAtTime(160,t0); o.frequency.exponentialRampToValueAtTime(45,t0+0.14);
      g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(1,t0+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.2);
      o.connect(g); g.connect(out); o.start(t0); o.stop(t0+0.25);
      // 金属っぽい「カッ」
      const len=Math.floor(ac.sampleRate*0.09), buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
      const n=ac.createBufferSource(); n.buffer=buf;
      const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1700; bp.Q.value=2.5;
      const ng=ac.createGain(); ng.gain.value=1.4; n.connect(bp); bp.connect(ng); ng.connect(out); n.start(t0);
      // 2発目（ガ・コッ）
      const o2=ac.createOscillator(), g2=ac.createGain(); o2.type='triangle';
      o2.frequency.setValueAtTime(420,t0+0.045); o2.frequency.exponentialRampToValueAtTime(120,t0+0.11);
      g2.gain.setValueAtTime(0.0001,t0+0.045); g2.gain.exponentialRampToValueAtTime(0.6,t0+0.05); g2.gain.exponentialRampToValueAtTime(0.0001,t0+0.16);
      o2.connect(g2); g2.connect(out); o2.start(t0+0.045); o2.stop(t0+0.2);
    }catch(e){}
  }

  /* pick dialog */
  let pickIdx=null;
  function openPick(i){
    pickIdx=i; $('pickNo').textContent=i+1;
    const st=s.board[i];
    $('pClear').style.display=st?'':'none';
    $('pHit').disabled=!!st||!canHit(); $('pMiss').disabled=!!st||!canMiss();
    $('pHit').style.opacity=$('pHit').disabled?.35:1; $('pMiss').style.opacity=$('pMiss').disabled?.35:1;
    $('pickSheet').classList.add('open');
  }
  const closePick=()=>{$('pickSheet').classList.remove('open');pickIdx=null};
  $('pHit').onclick=()=>{const i=pickIdx;closePick();hit(i)};
  $('pMiss').onclick=()=>{const i=pickIdx;closePick();miss(i)};
  $('pClear').onclick=()=>{const i=pickIdx;closePick();clearCell(i)};
  $('pCancel').onclick=closePick;
  $('pickSheet').addEventListener('click',e=>{if(e.target.id==='pickSheet') closePick()});

  document.addEventListener('keydown',e=>{
    if($('pickSheet').classList.contains('open')){
      const k=e.key.toLowerCase();
      if(k==='escape') closePick();
      else if(k==='a'&&!$('pHit').disabled) $('pHit').click();
      else if(k==='h'&&!$('pMiss').disabled) $('pMiss').click();
      return;
    }
    if($('sheet').classList.contains('open')) { if(e.key==='Escape') closeSheet(); return; }
    if(e.target.tagName==='INPUT') return;
    const k=e.key.toLowerCase();
    if(k==='a'){e.preventDefault();hit()}
    else if(k==='h'){e.preventDefault();miss()}
    else if(k==='z'){e.preventDefault();undo()}
  });

  /* clock (JST) */
  const tf=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const df=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'});
  function tick(){const d=new Date();$('clk').textContent=tf.format(d);$('dt').textContent=df.format(d)+' JST'}
  tick(); setInterval(tick,250);

  /* fullscreen */
  $('fsBtn').onclick=()=>{
    try{
      if(document.fullscreenElement) document.exitFullscreen();
      else { const p=document.documentElement.requestFullscreen?.(); p&&p.catch(()=>{}); }
    }catch(e){}
  };

  /* settings */
  function openSheet(){
    $('sRem').value=s.rem; $('sWin').value=s.win; $('sStr').value=s.streak; $('sSize').value=s.size; $('sTitle').value=s.title;
    $('swFx').classList.toggle('on',s.fx); $('sFxType').value=s.fxType||'neon'; $('swSound').classList.toggle('on',s.sound!==false); $('swStream').classList.toggle('on',s.stream); $('swBoard').classList.toggle('on',s.showBoard);
    $('err').textContent='';
    $('sheet').classList.add('open');
  }
  function closeSheet(){$('sheet').classList.remove('open')}
  $('setBtn').onclick=openSheet; $('closeBtn').onclick=closeSheet;
  $('sheet').addEventListener('click',e=>{if(e.target.id==='sheet') closeSheet()});
  document.querySelectorAll('.step button').forEach(b=>b.onclick=()=>{
    const i=$(b.dataset.t); let v=(parseInt(i.value,10)||0)+parseInt(b.dataset.d,10);
    if(i.id==='sSize') v=Math.min(60,Math.max(1,v)); else v=Math.max(0,v);
    i.value=v;
  });
  ['swFx','swSound','swStream','swBoard'].forEach(id=>$(id).onclick=e=>e.currentTarget.classList.toggle('on'));
  $('applyBtn').onclick=()=>{
    const rem=Math.max(0,parseInt($('sRem').value,10)||0);
    const win=Math.max(0,parseInt($('sWin').value,10)||0);
    const st=Math.max(0,parseInt($('sStr').value,10)||0);
    const size=Math.min(60,Math.max(1,parseInt($('sSize').value,10)||20));
    if(win>rem){$('err').textContent='当たり残口数は残り口数より多くできません';return}
    push();
    s.rem=rem; s.win=win; s.streak=st; s.start={rem,win};
    if(size!==s.size){s.size=size; fixBoard(); buildGrid();}
    s.title=$('sTitle').value.trim()||'オリパの遊園地';
    s.fx=$('swFx').classList.contains('on'); s.fxType=$('sFxType').value; s.sound=$('swSound').classList.contains('on'); s.stream=$('swStream').classList.contains('on'); s.showBoard=$('swBoard').classList.contains('on');
    lastRate=null; render(); closeSheet();
  };

  /* stars background */
  const sc=$('stars'), sx=sc.getContext('2d'); let stars=[];
  const COLORS=['#f8cb46','#41aef5','#ef4f3f','#5fd07a','#ff7aa8','#ffffff'];
  function sizeStars(){
    const dpr=Math.min(2,window.devicePixelRatio||1);
    sc.width=innerWidth*dpr; sc.height=innerHeight*dpr; sx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(innerWidth*innerHeight/9000);
    stars=Array.from({length:n},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,
      r:Math.random()*1.6+.4,c:COLORS[(Math.random()*COLORS.length)|0],p:Math.random()*6.28,sp:.6+Math.random()*1.4,big:Math.random()<.08}));
  }
  function star4(x,y,r){sx.beginPath();sx.moveTo(x,y-r*3);sx.quadraticCurveTo(x,y,x+r*3,y);sx.quadraticCurveTo(x,y,x,y+r*3);sx.quadraticCurveTo(x,y,x-r*3,y);sx.quadraticCurveTo(x,y,x,y-r*3);sx.fill()}
  function drawStars(t){
    sx.clearRect(0,0,innerWidth,innerHeight);
    for(const st of stars){
      sx.globalAlpha=.25+.55*(.5+.5*Math.sin(t/1000*st.sp+st.p));
      sx.fillStyle=st.c;
      if(st.big) star4(st.x,st.y,st.r*1.3); else {sx.beginPath();sx.arc(st.x,st.y,st.r*.7,0,6.28);sx.fill()}
    }
    sx.globalAlpha=1; requestAnimationFrame(drawStars);
  }
  addEventListener('resize',()=>{sizeStars();sizeFx();buildGrid();paintGrid()}); sizeStars(); requestAnimationFrame(drawStars);

  /* confetti */
  const fc=$('fx'), fx=fc.getContext('2d'); let parts=[], running=false;
  function sizeFx(){const dpr=Math.min(2,window.devicePixelRatio||1);fc.width=innerWidth*dpr;fc.height=innerHeight*dpr;fx.setTransform(dpr,0,0,dpr,0,0)}
  sizeFx();
  function celebrate(){
    const sp=$('splash'); sp.classList.remove('on'); void sp.offsetWidth; sp.classList.add('on');
    const W=innerWidth,H=innerHeight;
    for(const ox of [0,W]){
      for(let i=0;i<90;i++){
        const a=(ox===0?-Math.PI/3:-2*Math.PI/3)+(Math.random()-.5)*.9, v=9+Math.random()*10;
        parts.push({x:ox,y:H*.85,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:6+Math.random()*7,h:4+Math.random()*5,
          rot:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:COLORS[(Math.random()*COLORS.length)|0],life:0});
      }
    }
    if(!running){running=true;requestAnimationFrame(stepFx)}
  }
  function stepFx(){
    fx.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(p=>p.y<innerHeight+40&&p.life<260);
    for(const p of parts){
      p.vy+=.28; p.vx*=.99; p.vy*=.99; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++;
      fx.save(); fx.translate(p.x,p.y); fx.rotate(p.rot); fx.fillStyle=p.c;
      fx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.rot*2))+1); fx.restore();
    }
    if(parts.length) requestAnimationFrame(stepFx); else {running=false;fx.clearRect(0,0,innerWidth,innerHeight)}
  }

  buildGrid(); render();
})();
</script>
</body>
</html>
